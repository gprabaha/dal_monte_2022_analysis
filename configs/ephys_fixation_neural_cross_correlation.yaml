# configs/ephys_fixation_neural_cross_correlation.yaml
# Settings for fixation-level neural PSTH cross-correlation analyses.

# Input fixation PSTH trials (stored under processed_data_root).
trial_input_modality: psth
trial_input_filename: fixations_spike_train_1ms.pkl
# Legacy single-signal selector retained for direct single-column runs.
signal_input_column: spike_train_counts
# When multiple signal columns are listed here, raw outputs keep the legacy
# filename and each additional signal adds a signal label suffix
# (for example `_smoothed`) in the same date/session directory.
signal_input_columns: [spike_train_counts, smoothed_spike_train_counts]

# Outputs (stored under analysis_output_root).
# Within-region and cross-region analyses are written separately.
within_output_subdir: ephys/psth/fixation_neural_cross_correlation/within_region
cross_output_subdir: ephys/psth/fixation_neural_cross_correlation/cross_region
within_output_filename: fixations.pkl
cross_output_filename: fixations.pkl
within_pair_average_output_filename: pair_averages.pkl
cross_pair_average_output_filename: pair_averages.pkl


# Date-level sig-xcorr-pair analysis over saved fixation xcorr outputs.
# Each date output aggregates fixation-level traces across sessions by
# neural pair and fixation condition, then tests whether the per-fixation
# lag-mean is greater than 0. Separate raw and smoothed outputs are written
# to separate files, and each date also gets a compact group summary table.
pair_meta_within_output_subdir: ephys/psth/fixation_neural_cross_correlation/pair_meta_analysis/within_region
pair_meta_cross_output_subdir: ephys/psth/fixation_neural_cross_correlation/pair_meta_analysis/cross_region
pair_meta_within_output_filename: pair_fixation_lag_mean_significance.pkl
pair_meta_cross_output_filename: pair_fixation_lag_mean_significance.pkl
pair_meta_within_output_csv_filename: pair_fixation_lag_mean_significance.csv
pair_meta_cross_output_csv_filename: pair_fixation_lag_mean_significance.csv
pair_meta_alpha: 0.05
pair_meta_min_fixations: 2
pair_meta_use_parallel: true
pair_meta_parallelize_across_dates: true


# Date-level pair-condition mean aggregation over saved session pair-average outputs.
# Each date output pools pair-average traces across sessions by neural pair and
# fixation condition, weighting each session trace by its contributing fixation count.
pair_condition_mean_within_output_subdir: ephys/psth/fixation_neural_cross_correlation/pair_condition_means/within_region
pair_condition_mean_cross_output_subdir: ephys/psth/fixation_neural_cross_correlation/pair_condition_means/cross_region
pair_condition_mean_within_output_filename: pair_condition_means.pkl
pair_condition_mean_cross_output_filename: pair_condition_means.pkl
pair_condition_mean_within_output_csv_filename: pair_condition_means.csv
pair_condition_mean_cross_output_csv_filename: pair_condition_means.csv
pair_condition_mean_use_parallel: true
pair_condition_mean_parallelize_across_dates: true

# Region selection.
# Cross-region analysis computes anchor_region x partner_regions neuron pairs.
# Within-region analysis computes nC2 pairs for each included region.
anchor_region: BLA
partner_regions: [ACCg, dmPFC, OFC]
# Optional global filter for unit regions before pair building.
# Set null to keep all regions from the fixation PSTH trial rows.
include_regions: [BLA, ACCg, dmPFC, OFC]
# Canonical fixation category mapping retained in outputs (`fixation_category`)
# even when `fixation_location` stores ROI lists.
roi_groups:
  face: [face, mouth, eyes_nf]
  object: [right_nonsocial_object, left_nonsocial_object]
  out_of_roi: [out_of_roi]

# Signal processing and lag window.
# signal window is applied to the source trial signal before xcorr.
signal_window_ms: [-500.0, 500.0]
# signal_transform options: none | demean | zscore
signal_transform: none
# xcorr_normalization options: none | energy
# `energy` scales each pair trace by ||x||*||y|| during xcorr computation.
xcorr_normalization: energy
# null keeps the full lag span of the selected source signal.
max_lag: null

# Parallel/task controls.
use_parallel: true
# null -> use the full CPU allocation detected from Slurm/local runtime.
max_procs: null
# Parallelize across sessions (each session computes fixation-neuron pairs serially).
parallelize_across_sessions: true
pair_chunk_size: 64
test_single: false

# Plotting outputs from neural cross-correlation summaries.
# Date-level plots: PNG per date and region/region-pair.
# Global-level plots: PDF per region/region-pair across all dates.
plot_output_subdir: ephys/psth/fixation_neural_cross_correlation/plots
plot_date_output_extension: png
plot_region_output_extension: pdf
plot_date_output_dpi: 220
plot_region_output_dpi: 220
plot_date_figsize: [12.0, 4.0]
plot_region_figsize: [12.0, 4.0]
plot_condition_order: [face_interactive, face_non_interactive, object]
plot_condition_labels:
  face_interactive: Face (interactive)
  face_non_interactive: Face (non-interactive)
  object: Object
plot_condition_colors:
  face_interactive: "#d62728"
  face_non_interactive: "#1f77b4"
  object: "#2ca02c"
plot_pair_trace_alpha: 0.12
plot_pair_trace_linewidth: 0.75
plot_mean_trace_linewidth: 2.2
plot_mean_nonsig_alpha: 0.5
plot_significance_alpha: 0.05
# Applied only across the three fixation-condition pair tests at each lag.
# Options: none | bonferroni | holm | fdr_bh
plot_significance_correction: bonferroni
plot_min_samples_for_significance: 3
plot_between_condition_marker_size: 5.0
plot_between_condition_marker_alpha: 0.95
plot_subplot_ncols: 3
# Keep false because cross-correlation traces are normalized at analysis time.
plot_normalize_traces: false
plot_normalization_method: max_abs
plot_use_parallel: true
plot_max_procs: null
plot_parallelize_date_plots: true
plot_parallelize_global_plots: true
# null -> keep all pair traces
plot_max_pair_traces_per_plot: null
# Optional vector-size control for PDF outputs. null -> keep full lag resolution.
plot_max_points_per_pdf_trace: null
plot_random_seed: 13


# Pair-condition mean comparison plots and saved condition-comparison statistics.
# One figure/stat bundle is written per analysis kind and signal variant.
pair_condition_mean_plot_output_subdir: ephys/psth/fixation_neural_cross_correlation/pair_condition_mean_plots
pair_condition_mean_plot_output_extension: pdf
pair_condition_mean_plot_output_dpi: 220
pair_condition_mean_plot_figsize: [16.0, 4.6]
pair_condition_mean_plot_condition_short_labels:
  face_interactive: FI
  face_non_interactive: FNI
  object: OBJ
pair_condition_mean_plot_significance_alpha: 0.05
pair_condition_mean_plot_mean_lag_significance_correction: bonferroni
pair_condition_mean_plot_per_lag_significance_correction: bonferroni
pair_condition_mean_plot_min_pairs_for_significance: 3
pair_condition_mean_plot_mean_trace_linewidth: 2.2
pair_condition_mean_plot_sem_alpha: 0.12
pair_condition_mean_plot_between_condition_marker_size: 5.0
pair_condition_mean_plot_between_condition_marker_alpha: 0.95
pair_condition_mean_plot_annotation_fontsize: 8.0
pair_condition_mean_plot_lag_half_window_ms: 20.0
pair_condition_mean_plot_lag_tick_step_ms: 10.0
pair_condition_mean_plot_use_parallel: true
pair_condition_mean_plot_max_procs: null
pair_condition_mean_plot_lag_test_min_lags_for_parallel: 256
pair_condition_mean_plot_lag_test_chunk_size: 256

