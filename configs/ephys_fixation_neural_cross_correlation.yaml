# configs/ephys_fixation_neural_cross_correlation.yaml
# Settings for fixation-level neural PSTH cross-correlation analyses.

# Input fixation PSTH trials (stored under processed_data_root).
trial_input_modality: psth
trial_input_filename: fixations_spike_train_1ms.pkl
signal_input_column: spike_train_counts

# Outputs (stored under analysis_output_root).
# Within-region and cross-region analyses are written separately.
within_output_subdir: ephys/psth/fixation_neural_cross_correlation/within_region
cross_output_subdir: ephys/psth/fixation_neural_cross_correlation/cross_region
within_output_filename: fixations.pkl
cross_output_filename: fixations.pkl
within_pair_average_output_filename: pair_averages.pkl
cross_pair_average_output_filename: pair_averages.pkl

# Region selection.
# Cross-region analysis computes anchor_region x partner_regions neuron pairs.
# Within-region analysis computes nC2 pairs for each included region.
anchor_region: BLA
partner_regions: [ACCg, dmPFC, OFC]
# Optional global filter for unit regions before pair building.
# Set null to keep all regions from the fixation PSTH trial rows.
include_regions: [BLA, ACCg, dmPFC, OFC]
# Canonical fixation category mapping retained in outputs (`fixation_category`)
# even when `fixation_location` stores ROI lists.
roi_groups:
  face: [face, mouth, eyes_nf]
  object: [right_nonsocial_object, left_nonsocial_object]
  out_of_roi: [out_of_roi]

# Signal processing and lag window.
# signal window is applied to the source trial signal before xcorr.
signal_window_ms: [-500.0, 500.0]
# signal_transform options: none | demean | zscore
signal_transform: zscore
# xcorr_normalization options: none | energy
# `energy` scales each pair trace by ||x||*||y|| during xcorr computation.
xcorr_normalization: energy
# max lag is in bins of the selected source signal. At 1 ms bins, 500 = +/-500 ms.
max_lag: 500

# Parallel/task controls.
use_parallel: true
max_procs: 32
# Parallelize across sessions (each session computes fixation-neuron pairs serially).
parallelize_across_sessions: true
pair_chunk_size: 64
test_single: false

# Plotting outputs from neural cross-correlation summaries.
# Date-level plots: PNG per date and region/region-pair.
# Global-level plots: PDF per region/region-pair across all dates.
plot_output_subdir: ephys/psth/fixation_neural_cross_correlation/plots
plot_date_output_extension: png
plot_region_output_extension: pdf
plot_date_output_dpi: 220
plot_region_output_dpi: 220
plot_date_figsize: [12.0, 4.0]
plot_region_figsize: [12.0, 4.0]
plot_condition_order: [face_interactive, face_non_interactive, object]
plot_condition_labels:
  face_interactive: Face (interactive)
  face_non_interactive: Face (non-interactive)
  object: Object
plot_condition_colors:
  face_interactive: "#d62728"
  face_non_interactive: "#1f77b4"
  object: "#2ca02c"
plot_pair_trace_alpha: 0.12
plot_pair_trace_linewidth: 0.75
plot_mean_trace_linewidth: 2.2
plot_mean_nonsig_alpha: 0.5
plot_significance_alpha: 0.05
# Applied only across the three fixation-condition pair tests at each lag.
# Options: none | bonferroni | holm | fdr_bh
plot_significance_correction: bonferroni
plot_min_samples_for_significance: 3
plot_between_condition_marker_size: 5.0
plot_between_condition_marker_alpha: 0.95
plot_subplot_ncols: 3
# Keep false because cross-correlation traces are normalized at analysis time.
plot_normalize_traces: false
plot_normalization_method: max_abs
plot_use_parallel: true
plot_max_procs: 32
plot_parallelize_date_plots: true
plot_parallelize_global_plots: true
# null -> keep all pair traces
plot_max_pair_traces_per_plot: null
# Optional vector-size control for PDF outputs. null -> keep full lag resolution.
plot_max_points_per_pdf_trace: null
plot_random_seed: 13
