# configs/ephys_fixation_pair_spike_coordination.yaml
# Spike coordination between simultaneously recorded neural pairs, per fixation
# condition, within and across regions.

# --- Input -------------------------------------------------------------------
# The 1 ms fixation-aligned spike trains. This is the same extraction that
# produces fixations_psth_10ms.pkl, so the fixations, units and trials here are
# identical to the ones the single-unit, population-PCA and mRNN analyses use.
trial_input_modality: psth
trial_input_filename: fixations_spike_train_1ms.pkl

# Unsmoothed counts, deliberately. Smoothing before cross-correlation blurs the
# fine timing this analysis exists to measure; smooth the saved traces later if
# a figure needs it.
signal_input_column: spike_train_counts

# Matches the window every other fixation analysis reports on. Everything -- the
# observed correlation and both nulls -- is computed from spikes inside it.
# Widening it is not an option: 95% of +/-5 s surrounds contain at least one
# other analysed fixation (median 5), so data outside this window is not neutral
# baseline and a shifted-window null would compare against a different
# behavioural condition rather than a null.
signal_window_ms: [-500.0, 500.0]

# Cross-correlation is LINEAR (zero-padded transform), matching the behavioural
# cross-correlation analyses and the repo's fft_cross_correlation primitive. At
# lag L only the N-|L| genuinely overlapping bins contribute, so no spike is
# ever paired with one a full window away. A wrapping transform would pair a
# spike at -500 ms with one at +500 ms and report it at lag L, which is not a
# physical coincidence.
#
# Linear correlation tapers -- fewer bins contribute as |lag| grows -- but both
# nulls carry the identical taper, so it cancels in the excess and in every
# z-score. The per-lag overlap counts are stored with each output for figures
# that want raw magnitudes on a comparable scale across lags.

# --- Conditions --------------------------------------------------------------
# Identical to the single-unit / population condition set. Object fixations are
# pooled across interactive state, matching the `unsplit` average partition.
conditions: [face_interactive, face_non_interactive, object]

# --- Inclusion ---------------------------------------------------------------
min_fixations_per_condition: 8
min_spikes_per_unit_condition: 10
include_within_region: true
include_cross_region: true

# --- Null --------------------------------------------------------------------
# One null: the CIRCULAR SHIFT. Unit B's train is rotated by a random offset
# within its own fixation, so each fixation keeps its own spike counts and its
# slow envelope. Covariation of excitability across fixations therefore survives
# in the null and cannot by itself produce an excess; only fine temporal
# alignment is destroyed.
#
# This replaces the cross-trial shuffle, which pairs unit A's fixation i with
# unit B's fixation j and so destroys across-fixation rate covariation too. That
# is too low a bar: two cells whose rates rise and fall together across
# fixations, with no timing relationship at all, clear it easily.
# verify_null_sensitivity shows exactly that on a synthetic shared-gain pair,
# which reaches z = 2.0 against the cross-trial null and 1.3 against this one,
# level with an uncoupled pair.
n_circular_shift_draws: 50

# A rotation shorter than the coordination timescale of interest would leave the
# effect partly intact and make the null too conservative.
min_circular_shift_ms: 50.0

# Recompute every pair on a common fixation count across conditions. Interactive
# face fixations outnumber non-interactive ones roughly five to one, so this is
# the direct control on trial-count-driven differences.
trial_match_conditions: true

# --- Selectivity -------------------------------------------------------------
# FDR-corrected calls, per the project decision. Stored as a column, never used
# as a filter at build time, so the notebook can slice either way.
selectivity_subdir: ephys/psth/fixation_psth_selectivity
selectivity_unit_filename: unit_selectivity__three_condition_core.csv
selectivity_column: is_selective_unit_corrected

# --- Output ------------------------------------------------------------------
output_subdir: ephys/psth/fixation_pair_spike_coordination
output_filename: pair_coordination.pkl
# Half-width of the saved traces. The correlation is defined over -999..+999 ms,
# but every peak in this data returns to baseline well before 250 ms, and the
# overlap taper makes the far lags progressively noisier -- at 900 ms only 100
# of 1000 bins contribute. Storing 250 keeps the whole structure at a quarter of
# the size.
store_max_lag_ms: 250.0

summary_subdir: ephys/psth/fixation_pair_spike_coordination/summary

# --- Runtime -----------------------------------------------------------------
random_seed: 42
use_parallel: true
max_procs: 16
