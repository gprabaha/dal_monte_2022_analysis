    object: {unit_uuid: "359"}
  dmPFC:
    face_interactive: {unit_uuid: "1516"}
    face_non_interactive: {unit_uuid: "1751"}
    object: {unit_uuid: "1714"} # 1764
  OFC:
    face_interactive: {unit_uuid: "1091"} #1032, 1097
    face_non_interactive: {unit_uuid: "1304"}
    object: {unit_uuid: "1255"}

# Per-unit fixation PSTH plotting (stored in analysis_output_root)
plot_output_subdir: ephys/psth/fixation_psth_unit_plots
plot_output_extension: pdf
plot_output_dpi: 220
plot_use_parallel: true
plot_parallelize_units: true
plot_unit_parallel_min_units: 2
# Use precomputed date-level averages for mean/SEM traces in unit PSTH plots.
# Rasters still come from trial-level PSTHs.
# For face interactive/non-interactive traces, build averages with
# split_by_interactive_state: true.
plot_use_precomputed_average_traces: true
plot_average_input_subdir: ephys/psth/fixation_psth_averages
plot_average_input_filename: fixations_split_by_interactive_state.pkl
plot_average_input_filename_split: fixations_split_by_interactive_state.pkl
# Object traces can be sourced from an unsplit average file so object is not
# split by interactive state in downstream plotting/index workflows.
plot_average_object_input_subdir: ephys/psth/fixation_psth_averages
plot_average_object_input_filename: fixations_unsplit_by_interactive_state.pkl
plot_average_input_filename_unsplit: fixations_unsplit_by_interactive_state.pkl
# If true, conditions missing from average rows fall back to trial-derived traces.
plot_allow_trial_trace_fallback: false
plot_max_trials_per_condition: 300
plot_random_seed: 42
plot_smooth_before_average: true
plot_smoothing_sigma_ms: 20.0
plot_raster_jitter_within_bin: true
plot_raster_linelength: 1
plot_raster_linewidth: 2.0
plot_raster_alpha: 1.0
plot_raster_darkening_factor: 0.65
plot_raster_show_condition_background: false
plot_panel_raster_height_ratio: 1.2
plot_panel_rate_height_ratio: 2.0
plot_condition_colors:
  face_interactive: "#b64198"
  face_non_interactive: "#97ca3d"
  object: "#754c29"
