# configs/ephys_fixation_psth.yaml
# Session-level fixation-triggered PSTH extraction and date-level averaging.

# Inputs
fixations_modality: fixations
timeline_modality: neural_timeline
interactive_modality: interactive_periods

# Session-level trial PSTH output (stored in processed_data_root)
trial_output_modality: psth
# Use an event-specific filename (not shared.pkl) so multiple PSTH event families
# can coexist in the same modality folder later.
trial_output_filename: fixations.pkl

# Fixation category matching
roi_groups:
  face: ["face", "mouth", "eyes_nf"]
  object: ["right_nonsocial_object", "left_nonsocial_object"]
  out_of_roi: ["out_of_roi"]
categories: ["face", "object", "out_of_roi"]

# PSTH construction
bin_size_ms: 10.0
window_pre_s: 1.0
window_post_s: 1.0
include_interactive_state: true
interactive_high_label: interactive

# Parallel/task controls
use_parallel: true
average_use_parallel: true
max_procs: 16
test_single: false
agents: null

# Date-level average PSTH output (stored in analysis_output_root)
average_output_subdir: ephys/psth/fixation_psth_averages
# Primary (split) average output includes interactive-state-specific face rows.
average_output_filename: fixations_split_by_interactive_state.pkl
average_output_filename_split: fixations_split_by_interactive_state.pkl
# Secondary (unsplit) average output keeps face/object rows without interactive splitting.
average_output_subdir_unsplit: ephys/psth/fixation_psth_averages
average_output_filename_unsplit: fixations_unsplit_by_interactive_state.pkl
# Legacy toggle retained for compatibility with older scripts/notes.
split_by_interactive_state: true
restrict_interactive_state: null
group_by_session: false
smooth_before_average: true
smoothing_sigma_ms: 20.0
# Optional average-output resampling controls (default: disabled).
average_target_bin_size_ms: null
average_target_bin_step_ms: null

# Dedicated date-level average PSTH output for preference-index heatmaps.
# Uses wider bins and overlapping stride while keeping trial PSTHs unchanged.
selective_index_average_output_subdir: ephys/psth/fixation_psth_index_averages
# Primary split averages used for interactive/non-interactive face conditions.
selective_index_average_output_filename: fixations_split_by_interactive_state.pkl
selective_index_average_output_filename_split: fixations_split_by_interactive_state.pkl
# Secondary unsplit averages used for object condition traces.
selective_index_average_output_subdir_unsplit: ephys/psth/fixation_psth_index_averages
selective_index_average_output_filename_unsplit: fixations_unsplit_by_interactive_state.pkl
# Optional override for unsplit-object average subdir when different from split.
selective_index_average_object_output_subdir: null
selective_index_average_split_by_interactive_state: true
selective_index_average_restrict_interactive_state: null
selective_index_average_group_by_session: false
selective_index_average_smooth_before_average: false
selective_index_average_smoothing_sigma_ms: 20.0
selective_index_average_target_bin_size_ms: 50.0
selective_index_average_target_bin_step_ms: 25.0
selective_index_average_categories: ["face", "object"]

# Fixation selective-unit analysis (stored in analysis_output_root)
selective_output_subdir: ephys/psth/fixation_psth_selectivity
selective_window_stats_filename: window_stats.csv
selective_pair_summary_filename: pair_selectivity.csv
selective_unit_summary_filename: unit_selectivity.csv
selective_condition_summary_filename: condition_window_means.csv
selective_output_pickle_filename: results.pkl
selective_alpha: 0.05
selective_test: welch_ttest
selective_min_trials_per_condition: 2
selective_use_parallel: true
face_label: face
object_label: object
selective_windows_ms:
  pre_fix: [-500.0, 0.0]
  peri_fix: [-250.0, 250.0]
  post_fix: [0.0, 500.0]
  full_fix: [-500.0, 500.0]

# Per-bin pairwise preference-index analysis from fixation PSTH trial rows.
# For each pair (A, B), computes index=(A-B)/denominator and appends
# selectivity labels from pair_selectivity.csv and unit_selectivity.csv.
# denominator mode:
# - unit_max_sum: max(A+B) across bins for that unit/pair (default)
# - per_bin_sum:  A+B at each bin (legacy behavior)
selective_index_output_subdir: ephys/psth/fixation_psth_preference_index
selective_index_timeseries_filename: preference_index_timeseries.csv
selective_index_output_pickle_filename: results.pkl
selective_index_use_parallel: true
selective_index_use_average_input: true
selective_index_normalization_mode: unit_max_sum
# Bin window (ms) used for preference-index computation, sorting, and plotting base data.
# Keep this aligned with the unit-level selectivity window when needed.
selective_index_time_window_ms: [-500.0, 500.0]
selective_index_denominator_epsilon: 0.0
# Optional per-pair index-name overrides keyed by pair_label.
# pair_label format: "<condition_a>__vs__<condition_b>"
selective_index_pair_names:
  face_interactive__vs__face_non_interactive: interactive_face_preference_index
  face_interactive__vs__object: interactive_face_vs_object_index
  face_non_interactive__vs__object: non_interactive_face_vs_object_index

# Region-level population PCA for fixation mean PSTHs.
# Input resolution:
# - primary (default): date-level average PSTHs from split + unsplit files below
#   (face interactive/non-interactive from split; object from unsplit)
# - fallback: processed trial PSTHs in processed_data_root/psth/fixations.pkl
# Fits PCA on unit x time matrices in the configured time window for:
# - each condition independently (face_interactive / face_non_interactive / object)
# - all three conditions concatenated along time
# Outputs:
# - per-fit PCA summary
# - concatenated-fit PC timecourses split by condition
# - cross-condition explained-variance curves from per-condition fits
population_pca_trial_input_modality: psth
population_pca_trial_input_filename: fixations.pkl
# Prefer precomputed average PSTHs so smoothing/averaging settings are consistent
# with the dedicated average builders.
population_pca_prefer_trial_input: false
population_pca_allow_trial_fallback: true
population_pca_smooth_before_average: true
population_pca_smoothing_sigma_ms: 20.0
population_pca_input_subdir: ephys/psth/fixation_psth_averages
population_pca_input_filename: fixations_split_by_interactive_state.pkl
population_pca_input_filename_split: fixations_split_by_interactive_state.pkl
population_pca_object_input_subdir: ephys/psth/fixation_psth_averages
population_pca_object_input_filename: fixations_unsplit_by_interactive_state.pkl
population_pca_output_subdir: ephys/psth/fixation_population_pca
population_pca_summary_filename: pca_fit_summary.csv
population_pca_timecourse_filename: concatenated_pc_timecourses.csv
population_pca_explained_variance_filename: cross_condition_explained_variance.csv
population_pca_unit_inventory_filename: region_unit_inventory.csv
population_pca_output_pickle_filename: results.pkl
population_pca_window_ms: [-500.0, 500.0]
population_pca_max_components: 50
population_pca_min_units_per_region: 3
population_pca_require_all_conditions: true
population_pca_require_face_interactive_state: true
population_pca_verbose_logging: true
population_pca_use_parallel: true

# Preference-index heatmap plotting.
# Default footprint for combined 3x4 output: letter width x <= 2/5 letter height.
selective_index_plot_output_subdir: ephys/psth/fixation_psth_preference_index/plots
selective_index_plot_output_filename: preference_index_heatmaps
selective_index_plot_output_extension: pdf
selective_index_plot_output_dpi: 220
# Legacy boolean filter toggle (kept for backward compatibility):
# If true, each pair heatmap keeps only units selective for that exact pair
# (`is_selective_pair=true`), not units selective for any other pair.
selective_index_plot_include_only_pair_selective_units: true
# Preferred filter mode:
# - pair_selective: AB-specific selective units only (`is_selective_pair=true`)
# - any_selective: units selective for any pair (`is_selective_unit=true`)
# - all: no selectivity filter
selective_index_plot_unit_filter_mode: any_selective
# Selectivity windows used by heatmap filtering (should match Venn windows).
# This window list controls how pair significance is interpreted for plotting
# and excludes full_fix by default.
selective_index_plot_selective_windows: [pre_fix, peri_fix, post_fix]
# Optional: apply shared unit ordering (per region) from one reference pair label
# across all pair heatmaps.
selective_index_plot_sort_reference_pair: face_interactive__vs__face_non_interactive
# If true, render all selected pairs in one combined grid (rows=pairs, cols=regions).
selective_index_plot_combine_pairs_into_single_figure: true
# Which stored normalization to visualize in heatmaps:
# - unit_max_sum: plots preference_index_unit_max_sum
# - per_bin_sum: plots preference_index_per_bin_sum
selective_index_plot_normalization_mode: unit_max_sum
selective_index_plot_pair_order:
  - face_interactive__vs__face_non_interactive
  - face_interactive__vs__object
  - face_non_interactive__vs__object
selective_index_plot_region_order: [BLA, ACCg, dmPFC, OFC]
selective_index_plot_figure_width_in: 8.3
selective_index_plot_figure_height_in: 4.4
selective_index_plot_left_margin: 0.03
selective_index_plot_right_margin: 0.995
selective_index_plot_top_margin: 0.86
selective_index_plot_bottom_margin: 0.26
selective_index_plot_panel_wspace: 0.10
selective_index_plot_panel_hspace: 0.24
selective_index_plot_show_suptitle: false
selective_index_plot_colorbar_orientation: horizontal
selective_index_plot_colorbar_label: "|Preference Index|"
selective_index_plot_colorbar_fraction: 0.025
selective_index_plot_colorbar_pad: 0.08
selective_index_plot_colorbar_shrink: 0.72
selective_index_plot_colorbar_aspect: 48.0

# Region-level Venn plots from fixation selectivity outputs
selective_venn_output_subdir: ephys/psth/fixation_psth_selectivity_venn
selective_venn_output_extension: pdf
selective_venn_output_dpi: 220
selective_venn_selective_windows: [pre_fix, peri_fix, post_fix]
selective_venn_use_parallel: true
selective_venn_min_units_per_region: 1
selective_venn_combine_regions_into_single_figure: true
selective_venn_region_order: [BLA, ACCg, dmPFC, OFC]
selective_venn_combined_output_filename: regions_1x4
selective_venn_combined_figure_width_in: 8.5
selective_venn_combined_figure_height_in: 2.2
selective_venn_combined_left_margin: 0.01
selective_venn_combined_right_margin: 0.995
selective_venn_combined_top_margin: 0.79
selective_venn_combined_bottom_margin: 0.06
selective_venn_combined_wspace: 0.15
selective_venn_combined_show_pair_key: true

# Region-by-window triangular population plotting from three-way condition means
selective_triangular_output_subdir: ephys/psth/fixation_psth_selectivity_triangular
selective_triangular_output_filename: population_triangular
selective_triangular_output_extension: png
selective_triangular_output_dpi: 220
selective_triangular_min_units_per_panel: 1
selective_triangular_include_only_selective_units: true
selective_triangular_region_order: [BLA, ACCg, dmPFC, OFC]
selective_triangular_windows: [full_fix]
selective_triangular_figure_width_in: 8.5
selective_triangular_figure_height_in: 2.2
selective_triangular_show_suptitle: false
selective_triangular_left_margin: 0.02
selective_triangular_right_margin: 0.995
selective_triangular_top_margin: 0.86
selective_triangular_bottom_margin: 0.04
selective_triangular_panel_wspace: 0.10
selective_triangular_panel_hspace: 0.18
selective_triangular_point_size: 26.0
selective_triangular_point_color: "#1f1f1f"
selective_triangular_point_alpha_significant: 1.0
selective_triangular_point_alpha_non_significant: 0.5
selective_triangular_marker_edge_width: 0.28
selective_triangular_draw_centroid: true

# Cross-region comparison of triangular distributions (table outputs)
selective_region_comparison_output_subdir: ephys/psth/fixation_psth_selectivity_region_comparison
selective_region_comparison_pairwise_filename: pairwise_region_comparisons.csv
selective_region_comparison_window_filename: window_region_comparisons.csv
selective_region_comparison_output_pickle_filename: results.pkl
selective_region_comparison_min_units_per_region: 5
selective_region_comparison_min_regions_per_window: 2
selective_region_comparison_n_permutations: 1000
selective_region_comparison_random_seed: 42
selective_region_comparison_pvalue_correction: fdr_bh
selective_region_comparison_alpha: 0.05
selective_region_comparison_require_all_conditions_observed: true
selective_region_comparison_require_meets_min_trials: false
selective_region_comparison_require_selective_units: true
selective_region_comparison_pseudo_count: 1e-6
selective_region_comparison_alignment_cosine_threshold: 0.95

# Cross-region comparison heatmap plotting
selective_region_comparison_plot_output_subdir: ephys/psth/fixation_psth_selectivity_region_comparison/plots
selective_region_comparison_plot_output_filename: region_comparison_heatmaps
selective_region_comparison_plot_output_extension: png
selective_region_comparison_plot_output_dpi: 220
selective_region_comparison_plot_pvalue_floor: 1e-6
selective_region_comparison_plot_annotation_max_regions: 10

# Selective-unit firing-rate plotting
selective_plot_output_subdir: ephys/psth/fixation_psth_selective_unit_plots
selective_plot_output_extension: png
selective_example_subfolder: "example units"
selective_example_output_extensions: [pdf, png]
selective_example_significance_alpha: 0.05
selective_example_significance_test: welch_ttest
selective_example_significance_min_trials_per_condition: 2

# Selective-unit example grid plotting (3 rows x 4 columns)
# Intended layout footprint: full letter width x 2/5 letter height.
# Region/preference entries support either:
#   - {unit_uuid: "<uuid>"}
#   - {date: "YYYYMMDD", unit_uuid: "<uuid>"} (optional date when needed)
#   - "<uuid>" (date is auto-resolved if unique)
selective_example_grid_output_subdir: ephys/psth/fixation_psth_selective_unit_plots
selective_example_grid_output_filename: selective_example_grid_3x4
selective_example_grid_output_extension: pdf
selective_example_grid_output_dpi: 220
selective_example_grid_pdf_compression: 0
selective_example_grid_allow_missing: false
selective_example_grid_figure_width_in: 8.5
selective_example_grid_figure_height_in: 4.4
selective_example_grid_regions: [BLA, ACCg, dmPFC, OFC]
selective_example_grid_preferences: [face_interactive, face_non_interactive, object]
selective_example_grid_row_labels:
  face_interactive: "Interactive Face Favoring"
  face_non_interactive: "Non-Interactive Face Favoring"
  object: "Object Favoring"
# Dotted significance-window rectangles in mean-rate panel background.
# If selective_example_grid_rate_windows_ms is unset, defaults to
# selective_windows_ms.{pre_fix, peri_fix, post_fix}.
selective_example_grid_show_rate_windows: true
# selective_example_grid_rate_windows_ms:
#   - [-500.0, 0.0]
#   - [-250.0, 250.0]
#   - [0.0, 500.0]
selective_example_grid_rate_window_colors: ["#bdbdbd", "#8f8f8f", "#636363"]
selective_example_grid_rate_window_linestyle: ":"
selective_example_grid_rate_window_linewidth: 0.8
selective_example_grid_units:
  BLA:
    face_interactive: {unit_uuid: "789"}
    face_non_interactive: {unit_uuid: "553"}
    object: {unit_uuid: "2614"}
  ACCg:
    face_interactive: {unit_uuid: "118"}
    face_non_interactive: {unit_uuid: "395"} # 148
    object: {unit_uuid: "359"}
  dmPFC:
    face_interactive: {unit_uuid: "1516"}
    face_non_interactive: {unit_uuid: "1751"}
    object: {unit_uuid: "1714"} # 1764
  OFC:
    face_interactive: {unit_uuid: "1091"} #1032, 1097
    face_non_interactive: {unit_uuid: "1304"}
    object: {unit_uuid: "1255"}

# Per-unit fixation PSTH plotting (stored in analysis_output_root)
plot_output_subdir: ephys/psth/fixation_psth_unit_plots
plot_output_extension: pdf
plot_output_dpi: 220
plot_use_parallel: true
plot_parallelize_units: true
plot_unit_parallel_min_units: 2
# Use precomputed date-level averages for mean/SEM traces in unit PSTH plots.
# Rasters still come from trial-level PSTHs.
# For face interactive/non-interactive traces, build averages with
# split_by_interactive_state: true.
plot_use_precomputed_average_traces: true
plot_average_input_subdir: ephys/psth/fixation_psth_averages
plot_average_input_filename: fixations_split_by_interactive_state.pkl
plot_average_input_filename_split: fixations_split_by_interactive_state.pkl
# Object traces can be sourced from an unsplit average file so object is not
# split by interactive state in downstream plotting/index workflows.
plot_average_object_input_subdir: ephys/psth/fixation_psth_averages
plot_average_object_input_filename: fixations_unsplit_by_interactive_state.pkl
plot_average_input_filename_unsplit: fixations_unsplit_by_interactive_state.pkl
# If true, conditions missing from average rows fall back to trial-derived traces.
plot_allow_trial_trace_fallback: false
plot_max_trials_per_condition: 300
plot_random_seed: 42
plot_smooth_before_average: true
plot_smoothing_sigma_ms: 20.0
plot_raster_jitter_within_bin: true
plot_raster_linelength: 1
plot_raster_linewidth: 2.0
plot_raster_alpha: 1.0
plot_raster_darkening_factor: 0.65
plot_raster_show_condition_background: false
plot_panel_raster_height_ratio: 1.2
plot_panel_rate_height_ratio: 2.0
plot_condition_colors:
  face_interactive: "#b64198"
  face_non_interactive: "#97ca3d"
  object: "#754c29"
