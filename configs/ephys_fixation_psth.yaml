# configs/ephys_fixation_psth.yaml
# Session-level fixation-triggered PSTH extraction and date-level averaging.

# Inputs
fixations_modality: fixations
timeline_modality: neural_timeline
interactive_modality: interactive_periods

# Session-level trial PSTH output (stored in processed_data_root)
trial_output_modality: psth
# Use an event-specific filename (not shared.pkl) so multiple PSTH event families
# can coexist in the same modality folder later.
trial_output_filename: fixations.pkl

# Fixation category matching
roi_groups:
  face: ["face", "mouth", "eyes_nf"]
  object: ["right_nonsocial_object", "left_nonsocial_object"]
  out_of_roi: ["out_of_roi"]
categories: ["face", "object", "out_of_roi"]

# PSTH construction
bin_size_ms: 10.0
window_pre_s: 1.0
window_post_s: 1.0
include_interactive_state: true
interactive_high_label: interactive

# Parallel/task controls
use_parallel: true
average_use_parallel: true
max_procs: 16
test_single: false
agents: null

# Date-level average PSTH output (stored in analysis_output_root)
average_output_subdir: ephys/psth/fixation_psth_averages
average_output_filename: fixations.pkl
split_by_interactive_state: false
restrict_interactive_state: null
group_by_session: false
smooth_before_average: true
smoothing_sigma_ms: 20.0

# Per-unit fixation PSTH plotting (stored in analysis_output_root)
plot_output_subdir: ephys/psth/fixation_psth_unit_plots
plot_output_extension: pdf
plot_output_dpi: 220
plot_use_parallel: true
plot_parallelize_units: true
plot_unit_parallel_min_units: 2
plot_max_trials_per_condition: 300
plot_random_seed: 42
plot_smooth_before_average: true
plot_smoothing_sigma_ms: 20.0
plot_raster_jitter_within_bin: true
plot_raster_linelength: 1
plot_raster_linewidth: 2.0
plot_raster_alpha: 1.0
plot_raster_darkening_factor: 0.65
plot_raster_show_condition_background: false
plot_panel_raster_height_ratio: 1.2
plot_panel_rate_height_ratio: 2.0
plot_condition_colors:
  face_interactive: "#d62728"
  face_non_interactive: "#1f77b4"
  object: "#2ca02c"
