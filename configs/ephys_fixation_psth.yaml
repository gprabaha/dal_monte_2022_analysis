# Per-unit fixation PSTH plotting (stored in analysis_output_root)
# Route multiscale figures to a separate folder so older single-timescale plots remain intact.
plot_output_subdir: ephys/psth/fixation_psth_unit_plots_multiscale_5s
plot_output_extension: png
plot_figsize: [15.0, 6.8]
plot_output_dpi: 220
plot_use_parallel: true
plot_parallelize_units: true
plot_unit_parallel_min_units: 2
# Use precomputed date-level averages for mean/SEM traces in unit PSTH plots.
# Mean/SEM traces and per-bin significance come from 10 ms trial PSTHs.
# Rasters come from the separate 1 ms spike-train trials.
# For face interactive/non-interactive traces, build averages with
# split_by_interactive_state: true.
plot_use_precomputed_average_traces: true
plot_trial_input_modality: psth
plot_trial_input_filename: fixations_psth_10ms.pkl
plot_raster_trial_input_modality: psth
plot_raster_trial_input_filename: fixations_spike_train_1ms.pkl
plot_average_input_subdir: ephys/psth/fixation_psth_averages
plot_average_input_filename: fixations_psth_10ms.pkl
plot_average_input_filename_split: fixations_psth_10ms.pkl
# Object traces can be sourced from an unsplit average file so object is not
# split by interactive state in downstream plotting/index workflows.
plot_average_object_input_subdir: ephys/psth/fixation_psth_averages
plot_average_object_input_filename: fixations_psth_10ms.pkl
plot_average_input_filename_unsplit: fixations_psth_10ms.pkl
# If true, conditions missing from average rows fall back to trial-derived traces.
plot_allow_trial_trace_fallback: false
plot_segregate_selective_units: true
plot_selectivity_input_subdir: ephys/psth/fixation_psth_selectivity
plot_selectivity_unit_summary_filename: unit_selectivity.csv
plot_selective_unit_subfolder: selective
plot_max_trials_per_condition: 300
plot_random_seed: 42
plot_smooth_before_average: true
plot_smoothing_sigma_ms: 20.0
plot_raster_jitter_within_bin: true
plot_raster_linelength: 1
plot_raster_linewidth: 2.0
plot_raster_alpha: 1.0
plot_raster_darkening_factor: 0.65
plot_raster_show_condition_background: false
plot_panel_raster_height_ratio: 1.2
plot_panel_rate_height_ratio: 2.0
plot_display_half_windows_s: [5.0, 3.0, 1.0]
plot_show_analysis_window_overlays: true
# If unset, overlay windows default to selective_windows_ms.{pre_fix, peri_fix, post_fix}.
plot_analysis_window_colors: ["#9e9e9e", "#6f6f6f", "#3f3f3f"]
plot_analysis_window_linestyle: "--"
plot_analysis_window_linewidth: 1.4
plot_condition_colors:
  face_interactive: "#b64198"
  face_non_interactive: "#97ca3d"
  object: "#754c29"
