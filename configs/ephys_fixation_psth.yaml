# configs/ephys_fixation_psth.yaml
# Session-level fixation-triggered PSTH extraction and date-level averaging.

# Inputs
fixations_modality: fixations
timeline_modality: neural_timeline
interactive_modality: interactive_periods

# Session-level trial PSTH output (stored in processed_data_root)
trial_output_modality: psth
# Use an event-specific filename (not shared.pkl) so multiple PSTH event families
# can coexist in the same modality folder later.
trial_output_filename: fixations.pkl

# Fixation category matching
roi_groups:
  face: ["face", "mouth", "eyes_nf"]
  object: ["right_nonsocial_object", "left_nonsocial_object"]
  out_of_roi: ["out_of_roi"]
categories: ["face", "object", "out_of_roi"]

# PSTH construction
bin_size_ms: 10.0
window_pre_s: 1.0
window_post_s: 1.0
include_interactive_state: true
interactive_high_label: interactive

# Parallel/task controls
use_parallel: true
average_use_parallel: true
max_procs: 16
test_single: false
agents: null

# Date-level average PSTH output (stored in analysis_output_root)
average_output_subdir: ephys/psth/fixation_psth_averages
average_output_filename: fixations.pkl
split_by_interactive_state: false
restrict_interactive_state: null
group_by_session: false
smooth_before_average: true
smoothing_sigma_ms: 20.0

# Fixation selective-unit analysis (stored in analysis_output_root)
selective_output_subdir: ephys/psth/fixation_psth_selectivity
selective_window_stats_filename: window_stats.csv
selective_pair_summary_filename: pair_selectivity.csv
selective_unit_summary_filename: unit_selectivity.csv
selective_condition_summary_filename: condition_window_means.csv
selective_output_pickle_filename: results.pkl
selective_alpha: 0.05
selective_test: welch_ttest
selective_min_trials_per_condition: 2
selective_use_parallel: true
face_label: face
object_label: object
selective_windows_ms:
  pre_fix: [-500.0, 0.0]
  peri_fix: [-250.0, 250.0]
  post_fix: [0.0, 500.0]

# Region-level Venn plots from fixation selectivity outputs
selective_venn_output_subdir: ephys/psth/fixation_psth_selectivity_venn
selective_venn_output_extension: pdf
selective_venn_output_dpi: 220
selective_venn_use_parallel: true
selective_venn_min_units_per_region: 1
selective_venn_combine_regions_into_single_figure: true
selective_venn_region_order: [BLA, ACCg, dmPFC, OFC]
selective_venn_combined_output_filename: regions_1x4
selective_venn_combined_figure_width_in: 8.5
selective_venn_combined_figure_height_in: 2.2
selective_venn_combined_left_margin: 0.01
selective_venn_combined_right_margin: 0.995
selective_venn_combined_top_margin: 0.79
selective_venn_combined_bottom_margin: 0.06
selective_venn_combined_wspace: 0.15
selective_venn_combined_show_pair_key: true

# Region-by-window triangular population plotting from three-way condition means
selective_triangular_output_subdir: ephys/psth/fixation_psth_selectivity_triangular
selective_triangular_output_filename: population_triangular
selective_triangular_output_extension: png
selective_triangular_output_dpi: 220
selective_triangular_min_units_per_panel: 1
selective_triangular_point_size: 26.0
selective_triangular_point_color: "#1f1f1f"
selective_triangular_point_alpha_significant: 1.0
selective_triangular_point_alpha_non_significant: 0.5
selective_triangular_marker_edge_width: 0.28
selective_triangular_draw_centroid: true

# Cross-region comparison of triangular distributions (table outputs)
selective_region_comparison_output_subdir: ephys/psth/fixation_psth_selectivity_region_comparison
selective_region_comparison_pairwise_filename: pairwise_region_comparisons.csv
selective_region_comparison_window_filename: window_region_comparisons.csv
selective_region_comparison_output_pickle_filename: results.pkl
selective_region_comparison_min_units_per_region: 5
selective_region_comparison_min_regions_per_window: 2
selective_region_comparison_n_permutations: 1000
selective_region_comparison_random_seed: 42
selective_region_comparison_pvalue_correction: fdr_bh
selective_region_comparison_alpha: 0.05
selective_region_comparison_require_all_conditions_observed: true
selective_region_comparison_require_meets_min_trials: false
selective_region_comparison_pseudo_count: 1e-6

# Cross-region comparison heatmap plotting
selective_region_comparison_plot_output_subdir: ephys/psth/fixation_psth_selectivity_region_comparison/plots
selective_region_comparison_plot_output_filename: region_comparison_heatmaps
selective_region_comparison_plot_output_extension: png
selective_region_comparison_plot_output_dpi: 220
selective_region_comparison_plot_pvalue_floor: 1e-6
selective_region_comparison_plot_annotation_max_regions: 10

# Selective-unit firing-rate plotting
selective_plot_output_subdir: ephys/psth/fixation_psth_selective_unit_plots
selective_plot_output_extension: png
selective_example_subfolder: "example units"
selective_example_output_extensions: [pdf, png]
selective_example_significance_alpha: 0.05
selective_example_significance_test: welch_ttest
selective_example_significance_min_trials_per_condition: 2

# Selective-unit example grid plotting (3 rows x 4 columns)
# Intended layout footprint: full letter width x 3/5 letter height.
# Region/preference entries support either:
#   - {unit_uuid: "<uuid>"}
#   - {date: "YYYYMMDD", unit_uuid: "<uuid>"} (optional date when needed)
#   - "<uuid>" (date is auto-resolved if unique)
selective_example_grid_output_subdir: ephys/psth/fixation_psth_selective_unit_plots
selective_example_grid_output_filename: selective_example_grid_3x4
selective_example_grid_output_extension: pdf
selective_example_grid_output_dpi: 220
selective_example_grid_pdf_compression: 0
selective_example_grid_allow_missing: false
selective_example_grid_figure_width_in: 8.5
selective_example_grid_figure_height_in: 6.6
selective_example_grid_regions: [BLA, ACCg, dmPFC, OFC]
selective_example_grid_preferences: [face_interactive, face_non_interactive, object]
selective_example_grid_row_labels:
  face_interactive: "Interactive Face Favoring"
  face_non_interactive: "Non-Interactive Face Favoring"
  object: "Object Favoring"
selective_example_grid_units:
  BLA:
    face_interactive: {unit_uuid: "789"}
    face_non_interactive: {unit_uuid: "553"}
    object: {unit_uuid: "2614"}
  ACCg:
    face_interactive: {unit_uuid: "118"}
    face_non_interactive: {unit_uuid: "148"}
    object: {unit_uuid: "359"}
  dmPFC:
    face_interactive: {unit_uuid: "1516"}
    face_non_interactive: {unit_uuid: "1751"}
    object: {unit_uuid: "1764"}
  OFC:
    face_interactive: {unit_uuid: "1032"}
    face_non_interactive: {unit_uuid: "1304"}
    object: {unit_uuid: "1255"}

# Per-unit fixation PSTH plotting (stored in analysis_output_root)
plot_output_subdir: ephys/psth/fixation_psth_unit_plots
plot_output_extension: pdf
plot_output_dpi: 220
plot_use_parallel: true
plot_parallelize_units: true
plot_unit_parallel_min_units: 2
plot_max_trials_per_condition: 300
plot_random_seed: 42
plot_smooth_before_average: true
plot_smoothing_sigma_ms: 20.0
plot_raster_jitter_within_bin: true
plot_raster_linelength: 1
plot_raster_linewidth: 2.0
plot_raster_alpha: 1.0
plot_raster_darkening_factor: 0.65
plot_raster_show_condition_background: false
plot_panel_raster_height_ratio: 1.2
plot_panel_rate_height_ratio: 2.0
plot_condition_colors:
  face_interactive: "#b64198"
  face_non_interactive: "#97ca3d"
  object: "#754c29"
