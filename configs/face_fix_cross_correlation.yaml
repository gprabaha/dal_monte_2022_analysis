# configs/face_fix_cross_correlation.yaml
# Settings for face fixation cross-correlation analysis.

input_modality: fixation_binary_vectors
fixation_label: face
output_subdir: fix_cross_correlation
within_filename: within_session_face_fix_cross_correlation.pkl
cross_filename: cross_session_face_fix_cross_correlation.pkl

# Max absolute lag (in samples) to keep in the saved cross-correlation arrays.
# 1 minute at 1 kHz => 60,000 samples on each side, so up to 120,001 lags total
# when both vectors are long enough (-60000..60000, including lag 0).
max_lag: 60000

# Cross-session pairing behavior.
# Set to null to evaluate all pairs.
cross_pairs_max: null
cross_pairs_seed: 13
cross_exclude_same_session: true
cross_exclude_same_date: false
parallelize_across_crosscorr_pairs: false

# Optional: limit to a single session/few pairs for quick testing.
test_single: false
