# configs/face_fix_cross_correlation.yaml
# Settings for face fixation cross-correlation analysis.

input_modality: fixation_binary_vectors
fixation_label: face
# Folder for leader/follower CSV outputs.
output_subdir: fix_cross_correlation
# Folder for cross-correlation pickle outputs.
crosscorr_output_subdir: crosscorr_outputs
# Folder (inside crosscorr_output_subdir) for m1-m2 comparison PDFs.
m1_m2_plot_output_subdir: plots/m1-m2
# Scope order for m1-m2 comparison panels.
m1_m2_plot_scopes: [whole, interactive, non_interactive]
# Per-lag paired t-test alpha for observed-vs-control m1-m2 plots.
m1_m2_plot_significance_alpha: 0.05
# Lag axis unit conversion for m1-m2 plots (lags / sampling_rate_hz -> seconds).
m1_m2_plot_lag_sampling_rate_hz: 1000.0
m1_m2_plot_max_points: 4000
m1_m2_plot_max_sig_markers: 1000
m1_m2_plot_rasterize_bands: true
m1_m2_plot_rasterize_sig_markers: true
m1_m2_plot_ttest_parallel: true
# null -> auto from CPU count
m1_m2_plot_ttest_parallel_workers: null
m1_m2_plot_ttest_parallel_min_lags: 4000
m1_m2_plot_ttest_parallel_chunk_size: 4096
m1_m2_observed_vs_cross_filename: observed_vs_cross_session_face_m1_m2_crosscorr.pdf
m1_m2_observed_vs_shuffle_filename: observed_vs_shuffle_face_m1_m2_crosscorr.pdf

# Leader-aligned cross-correlation plots (session/date/pair leader bases).
lf_plot_output_subdir: plots/leader_follower
lf_plot_scopes: [whole, interactive, non_interactive]
lf_plot_leader_bases: [session, date, pair]
lf_plot_significance_alpha: 0.05
lf_plot_lag_sampling_rate_hz: 1000.0
lf_plot_max_points: 4000
lf_plot_max_sig_markers: 1000
lf_plot_rasterize_bands: true
lf_plot_rasterize_sig_markers: true
lf_plot_ttest_parallel: true
lf_plot_ttest_parallel_workers: null
lf_plot_ttest_parallel_min_lags: 4000
lf_plot_ttest_parallel_chunk_size: 4096
lf_observed_vs_cross_filename_template: observed_vs_cross_session_face_leader_follower_basis={basis}.pdf
lf_observed_vs_shuffle_filename_template: observed_vs_shuffle_face_leader_follower_basis={basis}.pdf

# Time-scope filtering for fixation vectors before cross-correlation:
# - whole
# - interactive
# - non_interactive
time_scope: whole
interactive_modality: interactive_periods
interactive_state_label: interactive

# Optional explicit filenames. If null, algorithmic names are generated from
# fixation_label + time_scope in utils.paths.build_fix_cross_correlation_output_filename.
within_filename: null
# Cross output now stores per-session cross-control summaries (mean/std/n_pairs),
# not all raw n*(n-1) pair traces.
cross_filename: null
# Optional override for the shared lag-axis file. If null, defaults to:
# "<...>__phase=<time_scope>.pkl"
lags_filename: null

# Max absolute lag (in samples) to keep in the saved cross-correlation arrays.
# 1 minute at 1 kHz => 60,000 samples on each side, so up to 120,001 lags total
# when both vectors are long enough (-60000..60000, including lag 0).
max_lag: 60000

# Cross-session pairing behavior.
# Set to null to evaluate all pairs.
cross_pairs_max: null
cross_pairs_seed: 13
cross_exclude_same_session: true
cross_exclude_same_date: false
parallelize_across_crosscorr_pairs: true

# Optional: limit to a single session/few pairs for quick testing.
test_single: false

# Within-session shuffled distribution settings.
shuffle_output_filename: null
shuffle_pairs_subdir: within_session_shuffle_pair_results
shuffle_n_shuffles: 1000
shuffle_stringent: true
shuffle_seed: 13
shuffle_parallelize_within_pair: true
# Worker log cadence for shuffled draws (prints every N shuffles).
shuffle_log_every: 100

# Optional leader-follower analysis settings (used by
# scripts/behav/analysis/build_face_fix_cross_correlation_leader_follower.py).
leader_follower_output_subdir: crosscorr_outputs/leader_follower
leader_follower_time_scope: whole
leader_follower_tie_epsilon: 0.0
leader_follower_session_filename: within_session_face_fix_crosscorr_leader_follower.pkl
leader_follower_date_summary_filename: date_summary_face_fix_crosscorr_leader_follower.pkl
leader_follower_pair_summary_filename: pair_summary_face_fix_crosscorr_leader_follower.pkl
leader_follower_global_summary_filename: global_summary_face_fix_crosscorr_leader_follower.pkl
leader_follower_fixations_modality: fixations
leader_follower_pupil_modality: pupil_size
leader_follower_pupil_session_filename: within_session_face_fix_crosscorr_leader_follower_pupil_during_fixation.csv
leader_follower_pupil_date_summary_filename: date_summary_face_fix_crosscorr_leader_follower_pupil_during_fixation.csv
leader_follower_pupil_pair_summary_filename: pair_summary_face_fix_crosscorr_leader_follower_pupil_during_fixation.csv
leader_follower_pupil_global_summary_filename: global_summary_face_fix_crosscorr_leader_follower_pupil_during_fixation.csv
leader_follower_monkey_role_pupil_session_filename: within_session_face_fix_crosscorr_leader_follower_pupil_by_monkey_role.csv
leader_follower_monkey_role_pupil_session_raw_filename: within_session_face_fix_crosscorr_leader_follower_pupil_by_monkey_role_raw.pkl
leader_follower_monkey_role_pupil_summary_filename: summary_face_fix_crosscorr_leader_follower_pupil_by_monkey_role.csv
leader_follower_monkey_role_fixation_count_session_filename: within_session_face_fix_crosscorr_leader_follower_fixation_count_by_monkey_role.csv
leader_follower_monkey_role_fixation_count_summary_filename: summary_face_fix_crosscorr_leader_follower_fixation_count_by_monkey_role.csv
leader_follower_monkey_role_fixation_duration_session_filename: within_session_face_fix_crosscorr_leader_follower_fixation_duration_by_monkey_role.csv
leader_follower_monkey_role_fixation_duration_summary_filename: summary_face_fix_crosscorr_leader_follower_fixation_duration_by_monkey_role.csv
leader_follower_monkey_role_pupil_violin_filename: summary_face_fix_crosscorr_leader_follower_pupil_by_monkey_role_violin.pdf
leader_follower_monkey_role_pupil_make_violin_plot: true
leader_follower_monkey_role_pupil_plot_max_samples_per_role: 20000
leader_follower_pupil_global_overlay_filename: global_face_fix_crosscorr_leader_follower_pupil_leader_vs_follower_with_monkey_overlay.pdf
leader_follower_pupil_global_overlay_make_plot: true
leader_follower_pupil_global_overlay_plot_max_samples_per_role: 50000
leader_follower_pupil_global_overlay_show_legend: false
leader_follower_monkey_role_fixation_count_violin_filename: summary_face_fix_crosscorr_leader_follower_fixation_count_by_monkey_role_violin.pdf
leader_follower_monkey_role_fixation_count_make_violin_plot: true
leader_follower_monkey_role_fixation_count_plot_max_samples_per_role: 20000
leader_follower_monkey_role_fixation_duration_violin_filename: summary_face_fix_crosscorr_leader_follower_fixation_duration_by_monkey_role_violin.pdf
leader_follower_monkey_role_fixation_duration_make_violin_plot: true
leader_follower_monkey_role_fixation_duration_plot_max_samples_per_role: 20000
# If true, analyze all fixations for pupil/count/duration properties (ignores ROI keywords).
leader_follower_property_use_all_fixations: false
# If true, restrict pupil samples to fixation samples that overlap requested
# interactive periods state (shared interactive-periods modality).
leader_follower_use_only_interactive_states: false
leader_follower_interactive_modality: interactive_periods
leader_follower_interactive_state_label: interactive
# Optional explicit ROI keywords for pupil-during-fixation extraction.
# If null, defaults are inferred from fixation_label (face -> face/eyes_nf/mouth).
leader_follower_pupil_roi_keywords: null
# Pupil leader-vs-follower test settings (Welch t-test).
leader_follower_pupil_test_alpha: 0.05
# Parallel processing settings for per-session pupil extraction.
leader_follower_pupil_parallelize_sessions: true
leader_follower_pupil_parallel_max_procs: 16
