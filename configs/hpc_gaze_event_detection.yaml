# HPC settings for gaze event (fixation/saccade) detection
env_name: gaze_processing
job_name: gaze_event_detection
worker_script_path: scripts/behav/features/hpc_fixation_saccade_detection_worker.py
job_file_path: hpc/gaze_event_jobs.txt
sbatch_script_path: hpc/gaze_event_jobs.sh
log_dir: hpc/gaze_event_logs
partition: psych_day
cpus_per_task: 8
mem_per_cpu: 2G
time_limit: "02:00:00"
