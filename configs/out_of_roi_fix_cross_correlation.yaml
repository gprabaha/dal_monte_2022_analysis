# configs/out_of_roi_fix_cross_correlation.yaml
# Settings for out-of-ROI fixation cross-correlation analysis.

input_modality: fixation_binary_vectors
fixation_label: out_of_roi
output_subdir: fix_cross_correlation
within_filename: within_session_out_of_roi_fix_cross_correlation.pkl
# Cross output stores per-session cross-control summaries (mean/std/n_pairs),
# not all raw n*(n-1) pair traces.
cross_filename: cross_session_out_of_roi_fix_cross_correlation.pkl
# Optional override for the shared lag-axis file. If null, defaults to:
# "<fixation_label>_crosscorrelation_lags.pkl"
lags_filename: null

# Max absolute lag (in samples) to keep in the saved cross-correlation arrays.
# 1 minute at 1 kHz => 60,000 samples on each side, so up to 120,001 lags total
# when both vectors are long enough (-60000..60000, including lag 0).
max_lag: 60000

# Cross-session pairing behavior.
# Set to null to evaluate all pairs.
cross_pairs_max: null
cross_pairs_seed: 13
cross_exclude_same_session: true
cross_exclude_same_date: false
parallelize_across_crosscorr_pairs: true

# Optional: limit to a single session/few pairs for quick testing.
test_single: false

# Within-session shuffled distribution settings.
shuffle_output_filename: within_session_out_of_roi_fix_cross_correlation_shuffle.pkl
shuffle_pairs_subdir: within_session_out_of_roi_shuffle_pair_results
shuffle_n_shuffles: 1000
shuffle_stringent: true
shuffle_seed: 13
shuffle_parallelize_within_pair: true
# Worker log cadence for shuffled draws (prints every N shuffles).
shuffle_log_every: 100

# Optional leader-follower analysis settings (used by
# scripts/analysis/build_out_of_roi_fix_crosscorr_leader_follower.py).
leader_follower_tie_epsilon: 0.0
leader_follower_session_filename: within_session_out_of_roi_fix_crosscorr_leader_follower.csv
leader_follower_date_summary_filename: date_summary_out_of_roi_fix_crosscorr_leader_follower.csv
leader_follower_pair_summary_filename: pair_summary_out_of_roi_fix_crosscorr_leader_follower.csv
leader_follower_global_summary_filename: global_summary_out_of_roi_fix_crosscorr_leader_follower.csv
