# configs/out_of_roi_fix_cross_correlation.yaml
# Settings for out-of-ROI fixation cross-correlation analysis.

input_modality: fixation_binary_vectors
fixation_label: out_of_roi
output_subdir: fix_cross_correlation
within_filename: within_session_out_of_roi_fix_cross_correlation.pkl
# Cross output stores per-session cross-control summaries (mean/std/n_pairs),
# not all raw n*(n-1) pair traces.
cross_filename: cross_session_out_of_roi_fix_cross_correlation.pkl
# Optional override for the shared lag-axis file. If null, defaults to:
# "<fixation_label>_crosscorrelation_lags.pkl"
lags_filename: null

# Max absolute lag (in samples) to keep in the saved cross-correlation arrays.
# 1 minute at 1 kHz => 60,000 samples on each side, so up to 120,001 lags total
# when both vectors are long enough (-60000..60000, including lag 0).
max_lag: 60000

# Cross-session pairing behavior.
# Set to null to evaluate all pairs.
cross_pairs_max: null
cross_pairs_seed: 13
cross_exclude_same_session: true
cross_exclude_same_date: false
parallelize_across_crosscorr_pairs: true

# Optional: limit to a single session/few pairs for quick testing.
test_single: false

# Within-session shuffled distribution settings.
shuffle_output_filename: within_session_out_of_roi_fix_cross_correlation_shuffle.pkl
shuffle_pairs_subdir: within_session_out_of_roi_shuffle_pair_results
shuffle_n_shuffles: 1000
shuffle_stringent: true
shuffle_seed: 13
shuffle_parallelize_within_pair: true
# Worker log cadence for shuffled draws (prints every N shuffles).
shuffle_log_every: 100

# Optional leader-follower analysis settings (used by
# scripts/analysis/build_out_of_roi_fix_crosscorr_leader_follower.py).
leader_follower_tie_epsilon: 0.0
leader_follower_session_filename: within_session_out_of_roi_fix_crosscorr_leader_follower.csv
leader_follower_date_summary_filename: date_summary_out_of_roi_fix_crosscorr_leader_follower.csv
leader_follower_pair_summary_filename: pair_summary_out_of_roi_fix_crosscorr_leader_follower.csv
leader_follower_global_summary_filename: global_summary_out_of_roi_fix_crosscorr_leader_follower.csv
leader_follower_fixations_modality: fixations
leader_follower_pupil_modality: pupil_size
leader_follower_pupil_session_filename: within_session_out_of_roi_fix_crosscorr_leader_follower_pupil_during_fixation.csv
leader_follower_pupil_date_summary_filename: date_summary_out_of_roi_fix_crosscorr_leader_follower_pupil_during_fixation.csv
leader_follower_pupil_pair_summary_filename: pair_summary_out_of_roi_fix_crosscorr_leader_follower_pupil_during_fixation.csv
leader_follower_pupil_global_summary_filename: global_summary_out_of_roi_fix_crosscorr_leader_follower_pupil_during_fixation.csv
leader_follower_monkey_role_pupil_session_filename: within_session_out_of_roi_fix_crosscorr_leader_follower_pupil_by_monkey_role.csv
leader_follower_monkey_role_pupil_summary_filename: summary_out_of_roi_fix_crosscorr_leader_follower_pupil_by_monkey_role.csv
leader_follower_monkey_role_pupil_violin_filename: summary_out_of_roi_fix_crosscorr_leader_follower_pupil_by_monkey_role_violin.pdf
leader_follower_monkey_role_pupil_make_violin_plot: true
leader_follower_monkey_role_pupil_plot_max_samples_per_role: 20000
leader_follower_pupil_global_overlay_filename: global_out_of_roi_fix_crosscorr_leader_follower_pupil_leader_vs_follower_with_monkey_overlay.pdf
leader_follower_pupil_global_overlay_make_plot: true
leader_follower_pupil_global_overlay_plot_max_samples_per_role: 50000
leader_follower_pupil_global_overlay_show_legend: false
# Optional explicit ROI keywords for pupil-during-fixation extraction.
# If null, defaults are inferred from fixation_label.
leader_follower_pupil_roi_keywords: null
# Pupil leader-vs-follower test settings (Welch t-test).
leader_follower_pupil_test_alpha: 0.05
# Parallel processing settings for per-session pupil extraction.
leader_follower_pupil_parallelize_sessions: true
leader_follower_pupil_parallel_max_procs: 16
leader_follower_monkey_role_fixation_count_session_filename: within_session_out_of_roi_fix_crosscorr_leader_follower_fixation_count_by_monkey_role.csv
leader_follower_monkey_role_fixation_count_summary_filename: summary_out_of_roi_fix_crosscorr_leader_follower_fixation_count_by_monkey_role.csv
leader_follower_monkey_role_fixation_count_violin_filename: summary_out_of_roi_fix_crosscorr_leader_follower_fixation_count_by_monkey_role_violin.pdf
leader_follower_monkey_role_fixation_count_make_violin_plot: true
leader_follower_monkey_role_fixation_count_plot_max_samples_per_role: 20000
leader_follower_monkey_role_fixation_duration_session_filename: within_session_out_of_roi_fix_crosscorr_leader_follower_fixation_duration_by_monkey_role.csv
leader_follower_monkey_role_fixation_duration_summary_filename: summary_out_of_roi_fix_crosscorr_leader_follower_fixation_duration_by_monkey_role.csv
leader_follower_monkey_role_fixation_duration_violin_filename: summary_out_of_roi_fix_crosscorr_leader_follower_fixation_duration_by_monkey_role_violin.pdf
leader_follower_monkey_role_fixation_duration_make_violin_plot: true
leader_follower_monkey_role_fixation_duration_plot_max_samples_per_role: 20000
# If true, analyze all fixations for pupil/count/duration properties (ignores ROI keywords).
leader_follower_property_use_all_fixations: true
