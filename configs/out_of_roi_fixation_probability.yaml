# configs/out_of_roi_fixation_probability.yaml
# Settings for out-of-ROI fixation probability analysis.

input_modality: fixation_binary_vectors
fixation_label: out_of_roi
output_subdir: fixation_probability
within_filename: within_session_out_of_roi_fixation_probability.csv
cross_filename: cross_session_out_of_roi_fixation_probability.csv
violin_filename: out_of_roi_fixation_probability_violin.csv

# Decimal precision used when storing probability strings.
decimal_precision: 50

# Cross-session pairing behavior.
# Set to null to evaluate all pairs.
cross_pairs_max: null
cross_pairs_seed: 13
cross_exclude_same_session: true
cross_exclude_same_date: false

# Optional: limit to a single session/pair for quick testing.
test_single: false
