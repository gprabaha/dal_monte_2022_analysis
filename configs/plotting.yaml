# configs/plotting.yaml
# Global plotting style settings for consistent output.

rc_params:
  pdf.fonttype: 42
  ps.fonttype: 42
  svg.fonttype: none
  font.family: DejaVu Sans
  font.size: 11
  axes.titlesize: 12
  axes.labelsize: 11
  xtick.labelsize: 10
  ytick.labelsize: 10
  axes.linewidth: 0.8
  lines.linewidth: 1.0
  savefig.bbox: tight
  savefig.transparent: true
  path.simplify: false
  pdf.compression: 0

figure:
  figsize: [8, 4]
  dpi: 300

violin:
  width: 0.7
  body_alpha: 0.8
  body_edgecolor: "#1f1f1f"
  body_linewidth: 0.8
  colors:
    product: "#6C8EBF"
    joint: "#E07B39"

quantiles:
  values: [0.25, 0.5, 0.75]
  color: "#1f1f1f"
  linewidth: 1.2
