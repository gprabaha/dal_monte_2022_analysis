# configs/plotting.yaml
# Global plotting style settings for consistent output.

rc_params:
  pdf.fonttype: 42
  ps.fonttype: 42
  svg.fonttype: none
  font.family: DejaVu Sans
  font.size: 11
  axes.titlesize: 12
  axes.labelsize: 11
  xtick.labelsize: 10
  ytick.labelsize: 10
  axes.linewidth: 0.8
  lines.linewidth: 1.0
  savefig.bbox: tight
  savefig.transparent: true
  path.simplify: false
  pdf.compression: 6

export:
  # Disable clipping masks in PDF exports for easier Illustrator editing.
  disable_pdf_clipping_masks: true

figure:
  figsize: [8, 4]
  dpi: 300

# Fixation probability violin styling used by face and out-of-ROI plots.
fixation_probability:
  # Sized to fit roughly half a US letter page when placed in Illustrator.
  figsize: [8.2, 4.8]
  # Hard cap for major y ticks (implemented as <= this count).
  y_max_ticks: 5
  styles:
    face:
      within:
        product: "#F7A6A6"
        joint: "#FF2D2D"
        body_alpha: 1.0
        body_edgecolor: "#1F1F1F"
      cross:
        product: "#F7A6A6"
        joint: "#FF2D2D"
        body_alpha: 1.0
        body_edgecolor: "#1F1F1F"
        hatch: "xx"
        fill: false
    out_of_roi:
      within:
        product: "#AFAFAF"
        joint: "#333333"
        body_alpha: 1.0
        body_edgecolor: "#1F1F1F"
      cross:
        product: "#AFAFAF"
        joint: "#333333"
        body_alpha: 1.0
        body_edgecolor: "#1F1F1F"
        hatch: "xx"
        fill: false
  within_pair_overlay:
    enabled: true
    use_pair_colors: true
    pair_colormap: "tab20"
    line_color: "#000000"
    line_alpha: 1.0
    line_width: 1.0
    marker_size: 24
    marker_linewidth: 0.45
    marker_alpha: 1.0
    clip_on: false

# Optional override for 3-panel m1-m2 cross-correlation comparison figures.
crosscorr_m1_m2_figsize: [16, 4.6]
crosscorr_m1_m2_colors:
  observed: "#1f77b4"
  control: "#d62728"

# Subsampling seed for cross-session plots to match within-session sample size.
cross_subsample_seed: 42

violin:
  width: 0.7
  body_alpha: 0.8
  body_edgecolor: "#1f1f1f"
  body_linewidth: 0.8
  inner: "quart"
  cut: 0
  colors:
    product: "#6C8EBF"
    joint: "#E07B39"
    leader: "#4C72B0"
    follower: "#DD8452"

# Face-fixation gap distribution histograms.
face_fixation_gap_distribution:
  m1_figsize: [9.2, 3.8]
  m1_m2_figsize: [9.2, 3.8]
  histogram_bins: 60
  density: true
  alpha: 0.42
  edgecolor: "#1F1F1F"
  linewidth: 0.8
  colors:
    interactive: "#1b9e77"
    non_interactive: "#7f7f7f"
    cross: "#d95f02"
  zero_line:
    color: "#1A1A1A"
    linewidth: 0.9
    linestyle: "--"
    alpha: 0.8

# Pupil vs fixation-density correlation violin style.
pupil_fixation_density_correlation:
  # Fit roughly half of a US letter page width.
  figsize: [4.2, 2.8]
  y_max_ticks: 5
  significance_alpha: 0.05
  violin_width: 0.78
  violin_edgecolor: "#1F1F1F"
  violin_linewidth: 0.8
  xtick_label_rotation: 20.0
  xtick_label_ha: right
  panel_titles:
    m1: "m1 pupil"
    m2: "m2 pupil"
  colors:
    m1_family: "#2abcb1"
    m2_family: "#4b3b7d"
  # Own-density violin is fully opaque, other-density is lighter, joint is intermediate.
  alphas:
    own: 1.0
    other: 0.30
    joint: 0.65
  significance:
    line_color: "#111111"
    line_width: 0.9
    text_size: 9
    text_pad_frac: 0.012
    bar_height_frac: 0.020
    top_pad_frac: 0.050
    step_frac: 0.080
  zero_line:
    color: "#1a1a1a"
    linewidth: 0.9
    linestyle: "-"
  y_margin_frac_bottom: 0.08
