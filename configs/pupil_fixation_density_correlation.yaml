# Settings for per-session pupil vs face-fixation-density correlations.

pupil_modality: smoothed_pupil_size
fixation_density_modality: fixation_density_vectors
joint_fixation_density_modality: joint_face_fixation_density
face_label: face
correlation_method: pearson

output_subdir: pupil_fixation_density_correlation
output_filename: within_session_pupil_vs_face_fixation_density_correlation.csv
plot_output_filename: pupil_fixation_density_correlation_violin.pdf

use_parallel: true
parallel_max_procs: 32

test_single: false
